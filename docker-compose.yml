services:
  koolws-addon:
    build: .
    container_name: koolws-addon
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - HOST=0.0.0.0
      # Optionnel: définissez l'URL publique ou l'IP de votre machine sur le réseau local
      # - BASE_URL=http://192.168.1.50:7000
